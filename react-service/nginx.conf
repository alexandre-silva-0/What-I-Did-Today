server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  # Arquivos com hash no nome gerados pelo build: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    # Anexos: até 8 arquivos de 10 MB por envio (o padrão do Nginx é só 1 MB)
    client_max_body_size 90m;

    proxy_pass http://task-service:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Qualquer outra rota cai no index.html (react-router cuida do resto)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
